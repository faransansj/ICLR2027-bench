[project]
name = "medical-benchmark"
version = "0.1.0"
description = "Phase 1 reproducible medical image benchmark scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4",
  "Pillow==10.3.0",
  "PyYAML==6.0.1",
  "torch==2.2.2",
  "torchvision==0.17.2",
]

[project.scripts]
medical-benchmark-train = "medical_benchmark.runners.train:main"
medical-benchmark-aggregate = "medical_benchmark.runners.aggregate:main"
medical-benchmark-validate = "medical_benchmark.runners.validate_run:main"
medical-benchmark-download = "medical_benchmark.models.download:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_benchmark"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
